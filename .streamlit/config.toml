# PLAN_V5_1_REVISION.md section 2: the dashboard's theme, matching the study
# report (https://claude.ai/artifact/UUTiDztG73g33b89BEiKWX) in both light and
# dark mode. Streamlit 1.64 accepts a Google Fonts URL directly in `font` /
# `headingFont` / `codeFont` as "<name>:<url>", so no [[theme.fontFaces]]
# table is needed here.

[theme]
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap, sans-serif"
headingFont = "IBM Plex Sans Condensed:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
baseRadius = "0.5rem"

[theme.light]
primaryColor = "#0d6b86"
backgroundColor = "#f5f7f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#18202b"
linkColor = "#0d6b86"
borderColor = "#d8dfe4"

[theme.dark]
primaryColor = "#56b7d4"
backgroundColor = "#10161c"
secondaryBackgroundColor = "#161f27"
textColor = "#e4ebf0"
linkColor = "#56b7d4"
borderColor = "#2a3742"
