# Disambiguates the capacity-price UNIT BASIS per market.
#
# config/markets.yaml in the (read-only) bess-market-forecast repo labels
# all three capacity markets simply "unit: EUR/MW", but tracing its own
# ingestion code (src/ingest/regelleistung.py) shows they are NOT on the
# same basis. Verified during bess-optimizer Milestone 0 by reading the
# ingestion source and cross-checking value magnitudes against known
# German market price levels:
#
#   - FCR source column: GERMANY_SETTLEMENTCAPACITY_PRICE_[EUR/MW]
#     -> the TOTAL price for the whole 4-hour settlement block.
#   - aFRR+/- source column: GERMANY_AVERAGE_CAPACITY_PRICE_[(EUR/MW)/h]
#     -> an HOURLY rate.
#
# price_basis controls how src/model/build.py scales each market's price
# in the objective (SPEC.md §4's "units warning"):
#   per_block_total  -> use the price as-is; do NOT multiply by block_hours
#   per_mw_hour      -> multiply by block_hours to get the block's revenue
#   per_mwh_energy   -> multiply by dispatched MWh (Δt), not by block_hours
#
# day_ahead has no such ambiguity — it's a standard EUR/MWh energy price
# used directly against MWh dispatched — and is listed here only so every
# market this optimizer touches has an explicit, checked basis.

price_basis:
  day_ahead: per_mwh_energy
  fcr: per_block_total
  afrr_pos: per_mw_hour
  afrr_neg: per_mw_hour

# Reserve bid MW granularity (PLAN_V4_REVISION.md section 4): FCR and aFRR
# tender in 1 MW minimum bids, 1 MW increments, 4-hour products, daily
# auctions (regelleistung.net tendering page,
# https://www.regelleistung.net/en-us/Become-a-balancing-service-provider/Tendering-and-bidding-process).
# day_ahead's 0.1 MW / EPEX-SPOT minimum order is a rounding detail on this
# battery's size and is UNVERIFIED (EPEX's site refuses automated fetches),
# so it is recorded but not enforced: 0 means "no granularity constraint".
bid_granularity_mw:
  day_ahead: 0
  fcr: 1.0
  afrr_pos: 1.0
  afrr_neg: 1.0
